# ──────────────────────────────────────────────────────────────────────────────
# istiod — Control plane de Istio
# Wave 2: depende de istio-base
# Corre en Node Group via affinity DoesNotExist
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://blob.istio.io/istio-release/charts
    chart: istiod
    targetRevision: "1.26.0"
    helm:
      values: |
        # istiod corre en el Node Group (Capa 1)
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: karpenter.sh/nodepool
                      operator: DoesNotExist
        # PDB para istiod
        pilot:
          replicaCount: 2
          autoscaleEnabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # istiod gestiona completamente estos webhooks en runtime: inyecta su CA
  # raiz en el caBundle y Kubernetes completa defaults (matchPolicy,
  # namespaceSelector, scope, timeoutSeconds, port) que no estan en el
  # manifiesto renderizado por Helm. jsonPointers apuntando solo al
  # caBundle no bastaba (seguian quedando otros campos en diff), asi que
  # se ignora el array completo de webhooks con jqPathExpressions.
  # Ref: https://github.com/argoproj/argo-cd/issues/12961
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks'
