# ──────────────────────────────────────────────────────────────────────────────
# istio-base — CRDs propios de Istio (Gateway, VirtualService, etc.)
#
# Los Gateway API CRDs (Gateway, HTTPRoute, GatewayClass) NO son estos —
# esos los instala gateway-api-crds-app.yaml en wave 0, antes que esta app.
#
# Orden via sync-waves:
#   Wave 0: gateway-api-crds (CRDs de Kubernetes Gateway API)
#   Wave 1: istio-base       (este archivo — CRDs propios de Istio)
#   Wave 2: istiod           (Control plane)
#   Wave 3: gateway          (definido en apps/istio/gateway.yaml, no expuesto aun)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://blob.istio.io/istio-release/charts
    chart: base
    targetRevision: "1.26.0"
    helm:
      values: |
        defaultRevision: default
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # istiod inyecta su CA raiz en el caBundle de este webhook al arrancar.
  # Ref: https://github.com/argoproj/argo-cd/issues/12961
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
